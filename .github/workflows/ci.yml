name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        run: pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t house-split:ci .

      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 house-split:ci
          sleep 3
          curl --fail http://localhost:8000/health

      # pinned to the commit of v0.36.0, not the tag, because tags can be moved
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: house-split:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  release:
    # only after a push to main, never on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the deploy branch
      packages: write # to push the image to GHCR
    # two releases at the same time could push the deploy branch in the wrong order
    concurrency: release
    env:
      IMAGE: ghcr.io/tomasmbrito/house-split
    steps:
      - uses: actions/checkout@v7
      # QEMU + buildx let us build for arm64 too, because kind on an M1/M2 Mac runs arm64
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      # main stays protected; the bot only writes to the deploy branch, which Argo CD watches
      - name: Update deploy branch
        run: |
          sed -i "s/newTag: .*/newTag: ${GITHUB_SHA}/" k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy ${GITHUB_SHA::7}"
          git push --force origin HEAD:deploy
